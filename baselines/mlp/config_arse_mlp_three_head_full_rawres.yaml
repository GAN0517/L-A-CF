experiment:
  name: single_task_mlp_baseline
data:
  path: data/data_model_ready.nc
  output_dir: outputs/config_arse_mlp_three_head_full_rawres
  input_window: 7
  mode_window: 7
  horizon: 1
  train_end: SET_TRAIN_END
  val_end: SET_VAL_END
  batch_size: 256
  num_workers: 0
  max_points: null
  external_et_targets:
    enabled: true
    source_name: GLEAM_v4.3a
    total_et:
      var: E
      path: data/et_total.nc
    vegetation_transpiration:
      var: Et
      path: data/et_transpiration.nc
variables:
  atm_total:
  - AODANA
  - ceres_all_sky_sw_down
  - t2m
  - u10
  - v10
  - blh
  - r
  - sp
  - tp
  - wind_speed_10m
  - aod_advection
  - aod_local_contrast
  land_total:
  - stl1
  - skt
  - sshf_wm2
  - slhf_wm2
  atm_anom:
  - t2m_anom15d
  - t2m_anom30d
  - ceres_all_sky_sw_down_anom15d
  - ceres_all_sky_sw_down_anom30d
  land_anom:
  - sshf_wm2_anom15d
  - sshf_wm2_anom30d
  - slhf_wm2_anom15d
  - slhf_wm2_anom30d
  main_targets:
  - swvl1
  - e_pos
  - evavt_pos
  aux_targets:
  - ceres_all_sky_sw_down
  - sshf_wm2
  - slhf_wm2
model:
  backbone: two_encoder_mlp_parallel_transformer_temporal
  raw_residual_mode: sequence
  hidden_dim: 128
  token_dim: 128
  encoder_layers: 2
  domain_transformer_layers: 1
  decoder_layers: 2
  dropout: 0.2
  attention_heads: 4
  main_head_groups:
  - - swvl1
  - - e_pos
  - - evavt_pos
  main_head_raw_variables: null
training:
  epochs: 20
  learning_rate: 0.0005
  weight_decay: 1.0e-05
  main_loss_mode: head_weighted
  main_loss_priority_target: null
  main_loss_priority_rho: 1.0
  main_head_loss_weights:
  - 1.0
  - 1.0
  - 1.0
  aux_loss_weight: 0.2
  component_constraint_weight: 0.05
  val_interval: 5
  patience: 5
  grad_clip_norm: 1.0
  device: auto
